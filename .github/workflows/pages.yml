name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate static site
        run: node scripts/validate.mjs

      - name: Run layout regression audit
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No supported Chrome/Chromium binary found on the runner."
            exit 1
          fi

          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/partybeam-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            sleep 0.25
          done

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=2400,1600 \
            --virtual-time-budget=15000 \
            --dump-dom \
            http://127.0.0.1:4173/scripts/layout-audit.html \
            > /tmp/layout-audit-dom.html

          grep -o '<pre id="result"[^>]*>[^<]*' /tmp/layout-audit-dom.html || true

          if ! grep -q 'id="result" data-status="pass"' /tmp/layout-audit-dom.html; then
            echo "Layout regression audit failed."
            grep -o '<pre id="result"[^>]*>[^<]*' /tmp/layout-audit-dom.html || cat /tmp/layout-audit-dom.html
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
