<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PartyBeam layout audit</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    iframe { display: block; width: 2200px; height: 1400px; border: 0; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <iframe id="app" src="../index.html" title="PartyBeam test target"></iframe>
  <pre id="result" data-status="pending">LAYOUT_AUDIT_PENDING</pre>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("app");
      const result = document.getElementById("result");
      const failures = [];
      let cases = 0;

      const waitFrames = (count = 3) => new Promise((resolve) => {
        window.setTimeout(resolve, Math.max(1, count) * 25);
      });

      function fail(label, details) {
        failures.push(label + (details ? " :: " + details : ""));
      }

      function assert(condition, label, details = "") {
        if (!condition) {
          fail(label, details);
        }
      }

      function rectInside(inner, outer, margin = 0) {
        return inner.left - margin >= outer.left - 1
          && inner.top - margin >= outer.top - 1
          && inner.right + margin <= outer.right + 1
          && inner.bottom + margin <= outer.bottom + 1;
      }

      function noHorizontalOverflow(element) {
        return element.scrollWidth <= element.clientWidth + 1;
      }

      function noVerticalOverflow(element) {
        return element.scrollHeight <= element.clientHeight + 1;
      }

      async function click(selector) {
        const doc = frame.contentDocument;
        const element = doc.querySelector(selector);
        if (!element) {
          fail("Missing control", selector);
          return;
        }

        element.click();
        await waitFrames();
      }

      async function setViewport(name) {
        await click('[data-viewport="' + name + '"]');
      }

      async function setPlayers(count) {
        await click('[data-players="' + count + '"]');
      }

      async function setContinueEnabled(enabled) {
        const doc = frame.contentDocument;
        const input = doc.getElementById("continueEnabled");
        input.checked = enabled;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFrames();
      }

      async function setUiState(value) {
        const doc = frame.contentDocument;
        const select = doc.getElementById("uiState");
        select.value = value;
        select.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFrames();
      }

      function pxValue(element, property) {
        return parseFloat(frame.contentWindow.getComputedStyle(element)[property]) || 0;
      }

      function validateCompactReadability(viewport) {
        const doc = frame.contentDocument;

        if (viewport === "tv720") {
          [
            ".eyebrow",
            ".home-card-description",
            ".game-code-label",
            ".game-code-hint",
            ".qr-caption",
            ".players-summary",
            ".app-version",
            ".partybeam-footer .screen-button--link"
          ].forEach((selector) => {
            const element = doc.querySelector(selector);
            assert(Boolean(element), "tv720 readability target missing", selector);
            if (element) {
              assert(
                pxValue(element, "fontSize") >= 12,
                "tv720 text below 12px",
                selector + "=" + pxValue(element, "fontSize")
              );
            }
          });
        }

        if (viewport === "phone") {
          [
            ".eyebrow",
            ".game-code-label",
            ".game-code-hint",
            ".qr-caption",
            ".players-summary",
            ".app-version",
            ".partybeam-footer .screen-button--link"
          ].forEach((selector) => {
            const element = doc.querySelector(selector);
            assert(Boolean(element), "phone readability target missing", selector);
            if (element) {
              assert(
                pxValue(element, "fontSize") >= 10,
                "phone text below 10px",
                selector + "=" + pxValue(element, "fontSize")
              );
            }
          });

          [
            "#settingsButton",
            "#continueButton",
            "#manageGamesButton"
          ].forEach((selector) => {
            const element = doc.querySelector(selector);
            assert(Boolean(element), "phone touch target missing", selector);
            if (element) {
              assert(
                element.getBoundingClientRect().height >= 44,
                "phone touch target below 44px",
                selector + "=" + element.getBoundingClientRect().height
              );
            }
          });

          const shellChecks = [
            [".viewport-button", "minHeight"],
            [".tool-toggle", "minHeight"],
            [".segmented-control button", "minHeight"]
          ];

          shellChecks.forEach(([selector, property]) => {
            const element = doc.querySelector(selector);
            assert(Boolean(element), "playground touch target missing", selector);
            if (element) {
              assert(
                pxValue(element, property) >= 44,
                "playground touch target below 44px",
                selector + "=" + pxValue(element, property)
              );
            }
          });

          const closeButton = doc.querySelector(".dev-close");
          assert(Boolean(closeButton), "playground close target missing");
          if (closeButton) {
            assert(
              pxValue(closeButton, "width") >= 44 && pxValue(closeButton, "height") >= 44,
              "playground close target below 44px",
              pxValue(closeButton, "width") + "x" + pxValue(closeButton, "height")
            );
          }
        }
      }

      function validateFocusSafety(label) {
        const doc = frame.contentDocument;
        const screen = doc.getElementById("partybeamScreen");
        const screenRect = screen.getBoundingClientRect();
        const targets = [
          doc.getElementById("settingsButton"),
          doc.getElementById("continueButton"),
          doc.getElementById("manageGamesButton"),
          doc.querySelector(".state-retry")
        ].filter(Boolean);

        for (const target of targets) {
          doc.querySelectorAll(".remote-focused").forEach((item) => item.classList.remove("remote-focused"));
          target.classList.add("remote-focused");

          const rect = target.getBoundingClientRect();
          assert(
            rectInside(rect, screenRect, 13),
            label + " remote focus clipped",
            target.id || target.className
          );
        }
      }

      async function dispatchKey(key) {
        const doc = frame.contentDocument;
        const event = new frame.contentWindow.KeyboardEvent("keydown", {
          key,
          bubbles: true,
          cancelable: true
        });

        doc.dispatchEvent(event);
        await waitFrames(1);
        return event.defaultPrevented;
      }

      async function validateKeyboardFocusHandoff(label, targetSelector) {
        const doc = frame.contentDocument;
        const target = doc.querySelector(targetSelector);

        if (!target) {
          fail(label + " keyboard target missing", targetSelector);
          return;
        }

        target.focus();
        await waitFrames(1);

        assert(doc.activeElement === target, label + " browser focus did not reach target");
        assert(
          doc.querySelectorAll(".remote-focused").length === 0,
          label + " remote ring remained visible during browser focus"
        );

        const enterPrevented = await dispatchKey("Enter");
        assert(!enterPrevented, label + " Enter was intercepted by remote handling");

        const beforeArrow = doc.activeElement;
        const arrowKey = target.id === "settingsButton" ? "ArrowDown" : "ArrowUp";
        const arrowPrevented = await dispatchKey(arrowKey);
        const afterArrow = doc.activeElement;

        assert(arrowPrevented, label + " spatial arrow was not handled");
        assert(afterArrow !== beforeArrow, label + " spatial arrow did not move DOM focus");
        assert(
          doc.getElementById("partybeamScreen").contains(afterArrow),
          label + " spatial arrow moved focus outside PartyBeam screen"
        );
        assert(
          doc.querySelectorAll(".remote-focused").length === 0,
          label + " remote ring reappeared while browser focus stayed inside screen"
        );

        afterArrow.blur();
        await waitFrames(1);

        assert(
          doc.querySelectorAll(".remote-focused").length === 1,
          label + " remote ring did not return after browser focus left screen"
        );
      }

      function validateLongName(label) {
        const doc = frame.contentDocument;
        const name = doc.querySelector(".player-name");
        if (!name) {
          fail(label + " long-name target missing");
          return;
        }

        name.textContent = "Alexandria Supercalifragilisticexpialidocious Controller";
        const slot = name.closest(".player-slot");
        const nameRect = name.getBoundingClientRect();
        const slotRect = slot.getBoundingClientRect();
        const style = frame.contentWindow.getComputedStyle(name);

        assert(rectInside(nameRect, slotRect), label + " long name leaves player tile");
        assert(style.overflow === "hidden", label + " long name overflow is not hidden");
        assert(style.textOverflow === "ellipsis", label + " long name has no ellipsis");
        assert(style.whiteSpace === "nowrap", label + " long name wrapping changed");
      }

      async function validateCatalog(viewport) {
        const doc = frame.contentDocument;

        await setPlayers(6);
        await setUiState("normal");
        await setContinueEnabled(true);

        const continueButton = doc.getElementById("continueButton");
        continueButton.focus();
        await waitFrames(1);
        continueButton.click();
        await waitFrames(2);

        const screen = doc.getElementById("partybeamScreen");
        const topbar = doc.querySelector(".partybeam-topbar");
        const lobby = doc.getElementById("lobbyScreen");
        const catalog = doc.getElementById("catalogScreen");
        const code = doc.querySelector(".catalog-game-code");
        const footer = doc.querySelector(".partybeam-footer");
        const playersPanel = doc.querySelector(".catalog-players-panel");
        const library = doc.querySelector(".catalog-library");
        const scroll = doc.getElementById("catalogScroll");
        const grid = doc.getElementById("gameCoverGrid");
        const covers = Array.from(doc.querySelectorAll(".game-cover"));

        cases += 1;

        assert(lobby.hidden, viewport + " catalog did not hide lobby");
        assert(!catalog.hidden, viewport + " catalog screen stayed hidden");
        assert(Boolean(code), viewport + " catalog game code missing from Players panel");
        assert(code.textContent.replace(/\s+/g, "").includes("GAMECODE8F4K2P"), viewport + " catalog game code changed");
        assert(footer.hidden, viewport + " catalog footer stayed visible");
        assert(covers.length >= 20, viewport + " catalog does not contain enough placeholder covers");
        assert(pxValue(playersPanel, "borderTopWidth") === 4, viewport + " catalog players panel border is not 4px");
        assert(pxValue(covers[0], "borderTopWidth") === 4, viewport + " game cover border is not 4px");
        assert(noHorizontalOverflow(catalog), viewport + " catalog horizontal overflow");
        assert(noHorizontalOverflow(library), viewport + " catalog library horizontal overflow");
        assert(scroll.scrollHeight > scroll.clientHeight + 1, viewport + " catalog does not vertically scroll");

        const screenRect = screen.getBoundingClientRect();
        const topbarRect = topbar.getBoundingClientRect();
        const catalogRect = catalog.getBoundingClientRect();
        const playersRect = playersPanel.getBoundingClientRect();
        const libraryRect = library.getBoundingClientRect();
        const scrollRect = scroll.getBoundingClientRect();
        const headingRect = doc.querySelector(".catalog-players-heading").getBoundingClientRect();
        const codeRect = code.getBoundingClientRect();
        const playersHeadingGroupRect = doc.querySelector(".catalog-players-heading__group").getBoundingClientRect();

        assert(rectInside(codeRect, headingRect), viewport + " catalog game code outside Players heading row");
        assert(
          playersHeadingGroupRect.right <= codeRect.left + 1,
          viewport + " Players summary overlaps game code"
        );

        assert(rectInside(catalogRect, screenRect), viewport + " catalog outside screen");
        assert(topbarRect.bottom <= catalogRect.top + 1, viewport + " catalog overlaps header");
        assert(playersRect.right <= libraryRect.left + 1, viewport + " player panel overlaps game library");
        assert(pxValue(catalog, "paddingBottom") <= 1, viewport + " catalog screen keeps bottom padding");

        const expectedCatalogBottomPadding = viewport === "tv720"
          ? 14
          : viewport === "phone"
            ? 10
            : 24;
        assert(
          Math.abs(pxValue(scroll, "paddingBottom") - expectedCatalogBottomPadding) <= 1,
          viewport + " catalog scroll bottom spacing is incorrect",
          String(pxValue(scroll, "paddingBottom"))
        );
        assert(
          Math.abs(screenRect.bottom - scrollRect.bottom) <= 2,
          viewport + " catalog scroll leaves a dead band at the bottom",
          String(screenRect.bottom - scrollRect.bottom)
        );

        const panelRatio = playersRect.width / catalogRect.width;
        if (viewport === "tv1080" || viewport === "tv720" || viewport === "full") {
          assert(panelRatio >= 0.225 && panelRatio <= 0.25, viewport + " player panel is not about 24%", String(panelRatio));
        }

        if (covers.length >= 6) {
          const firstRect = covers[0].getBoundingClientRect();
          const fifthRect = covers[4].getBoundingClientRect();
          const sixthRect = covers[5].getBoundingClientRect();
          const ratio = firstRect.height / Math.max(firstRect.width, 1);

          assert(Math.abs(ratio - 1.5) <= 0.04, viewport + " game cover is not 2:3", String(ratio));

          if (viewport === "tv1080" || viewport === "tv720" || viewport === "full") {
            assert(Math.abs(firstRect.top - fifthRect.top) <= 1, viewport + " first row is not five covers");
            assert(sixthRect.top > firstRect.top + 1, viewport + " sixth cover did not start a new row");
          }
        }

        const focused = doc.querySelector(".game-cover.remote-focused");
        assert(focused === covers[0], viewport + " first cover did not receive visible initial remote focus");
        assert(
          doc.activeElement !== covers[0],
          viewport + " catalog entry kept DOM focus on the first cover and suppressed TV focus"
        );

        const incompatible = covers.find((cover) => cover.classList.contains("game-cover--incompatible"));
        const compatible = covers.find((cover) => !cover.classList.contains("game-cover--incompatible"));
        assert(Boolean(incompatible), viewport + " catalog has no incompatible placeholder at six players");
        assert(Boolean(compatible), viewport + " catalog has no compatible placeholder at six players");

        if (incompatible) {
          incompatible.classList.add("remote-focused");
          const compatibility = incompatible.querySelector(".game-cover-compatibility");
          const warning = compatibility.querySelector("strong");
          const detail = compatibility.querySelector("span");
          const compatibilityRect = compatibility.getBoundingClientRect();
          const coverRect = incompatible.getBoundingClientRect();

          assert(
            frame.contentWindow.getComputedStyle(compatibility).display !== "none",
            viewport + " compatibility overlay stayed hidden on focus"
          );
          assert(
            rectInside(compatibilityRect, coverRect),
            viewport + " compatibility overlay leaves game cover"
          );

          assert(
            pxValue(compatibility, "borderTopWidth") === 2,
            viewport + " compatibility overlay border is not 2px"
          );

          if (viewport === "tv720") {
            assert(pxValue(warning, "fontSize") >= 12, "tv720 compatibility warning below 12px");
            assert(pxValue(detail, "fontSize") >= 12, "tv720 compatibility detail below 12px");
          }

          incompatible.classList.remove("remote-focused");
        }

        await setPlayers(8);
        const catalogPlayerRows = Array.from(doc.querySelectorAll("#catalogPlayersList .player-slot"));
        assert(catalogPlayerRows.length === 9, viewport + " catalog player panel did not render 8 players plus Waiting");
        catalogPlayerRows.forEach((row, index) => {
          assert(
            rectInside(row.getBoundingClientRect(), playersPanel.getBoundingClientRect()),
            viewport + " catalog player row clipped",
            "row=" + index
          );
        });

        const startScrollTop = scroll.scrollTop;
        for (let index = 0; index < 5; index += 1) {
          await dispatchKey("ArrowDown");
        }
        assert(scroll.scrollTop > startScrollTop, viewport + " remote navigation did not scroll catalog");

        await dispatchKey("Backspace");
        await waitFrames(2);

        assert(!lobby.hidden, viewport + " remote Back did not return to lobby");
        assert(catalog.hidden, viewport + " remote Back left catalog visible");
        assert(!footer.hidden, viewport + " lobby footer did not return");

        await setPlayers(6);
        await click("#continueButton");
        const firstCoverForKeyboard = doc.querySelector(".game-cover");
        firstCoverForKeyboard.focus();
        await waitFrames(1);
        const browserBackPrevented = await dispatchKey("Backspace");
        assert(browserBackPrevented, viewport + " keyboard Back was not handled from focused cover");
        assert(!lobby.hidden, viewport + " keyboard Back did not return to lobby");
        assert(catalog.hidden, viewport + " keyboard Back left catalog visible");
      }

      function validateLayout(label) {
        cases += 1;

        const doc = frame.contentDocument;
        const html = doc.documentElement;
        const body = doc.body;
        const screen = doc.getElementById("partybeamScreen");
        const topbar = doc.querySelector(".partybeam-topbar");
        const content = doc.querySelector(".partybeam-body");
        const homes = doc.querySelector(".home-sections");
        const players = doc.querySelector(".players-section");
        const actions = doc.querySelector(".lobby-actions");
        const footer = doc.querySelector(".partybeam-footer");
        const manage = doc.getElementById("manageGamesButton");

        const screenRect = screen.getBoundingClientRect();
        const topbarRect = topbar.getBoundingClientRect();
        const contentRect = content.getBoundingClientRect();
        const homesRect = homes.getBoundingClientRect();
        const playersRect = players.getBoundingClientRect();
        const actionsRect = actions.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();
        const manageRect = manage.getBoundingClientRect();

        assert(noHorizontalOverflow(html), label + " document horizontal scroll");
        assert(noHorizontalOverflow(body), label + " body horizontal scroll");
        assert(noHorizontalOverflow(screen), label + " screen horizontal overflow");
        assert(frame.contentWindow.getComputedStyle(screen).overflow === "hidden", label + " screen overflow guard changed");
        assert(noHorizontalOverflow(content), label + " body content horizontal overflow");
        assert(noVerticalOverflow(content), label + " body content vertical overflow");
        assert(noHorizontalOverflow(homes), label + " cards horizontal overflow");
        assert(noHorizontalOverflow(footer), label + " footer horizontal overflow");

        const homeCard = doc.querySelector(".home-card");
        const playerSlot = doc.querySelector(".player-slot");
        const settingsButton = doc.getElementById("settingsButton");
        const continueButton = doc.getElementById("continueButton");
        assert(pxValue(homeCard, "borderTopWidth") === 4, label + " home card border is not 4px");
        assert(pxValue(playerSlot, "borderTopWidth") === 2, label + " player slot border is not 2px");
        assert(pxValue(settingsButton, "borderTopWidth") === 2, label + " Settings border is not 2px");
        assert(pxValue(continueButton, "borderTopWidth") === 2, label + " Continue border is not 2px");

        assert(rectInside(topbarRect, screenRect), label + " header outside screen");
        assert(rectInside(contentRect, screenRect), label + " lobby body outside screen");
        assert(rectInside(footerRect, screenRect), label + " footer outside screen");
        assert(rectInside(manageRect, footerRect), label + " Manage games outside footer");

        assert(
          Math.abs(homesRect.left - playersRect.left) <= 1,
          label + " home cards left edge does not align with Players",
          "cards.left=" + homesRect.left + ", players.left=" + playersRect.left
        );
        assert(
          Math.abs(homesRect.right - playersRect.right) <= 1,
          label + " home cards right edge does not align with Players",
          "cards.right=" + homesRect.right + ", players.right=" + playersRect.right
        );
        assert(
          homesRect.bottom <= playersRect.top + 1,
          label + " players overlap main cards",
          "cards.bottom=" + homesRect.bottom + ", players.top=" + playersRect.top
        );
        assert(
          playersRect.bottom <= actionsRect.top + 1,
          label + " Continue overlaps players",
          "players.bottom=" + playersRect.bottom + ", actions.top=" + actionsRect.top
        );
        assert(
          topbarRect.bottom <= contentRect.top + 1,
          label + " content overlaps header"
        );
        assert(
          contentRect.bottom <= footerRect.top + 1,
          label + " content overlaps footer"
        );

        doc.querySelectorAll(".home-card, .player-slot, .screen-button, .state-card").forEach((element) => {
          const rect = element.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) {
            return;
          }

          assert(
            rect.right <= screenRect.right + 1 && rect.left >= screenRect.left - 1,
            label + " clipped control/card",
            element.id || element.className
          );
        });
      }

      async function run() {
        await waitFrames(5);

        const viewports = ["tv1080", "tv720", "phone", "full"];
        const playerCounts = [0, 1, 2, 4, 6, 8];

        for (const viewport of viewports) {
          await setViewport(viewport);
          await setUiState("normal");
          await setContinueEnabled(true);
          validateCompactReadability(viewport);

          for (const players of playerCounts) {
            await setPlayers(players);
            validateLayout(viewport + " / " + players + " players");
          }

          await setPlayers(8);
          validateLongName(viewport);
          validateLayout(viewport + " / long player name");

          await setContinueEnabled(false);
          validateLayout(viewport + " / Continue disabled");
          const continueButton = frame.contentDocument.getElementById("continueButton");
          assert(continueButton.disabled, viewport + " Continue did not become disabled");

          await setContinueEnabled(true);
          await setUiState("loading");
          validateLayout(viewport + " / loading");

          await setUiState("error");
          validateLayout(viewport + " / error");
          const retry = frame.contentDocument.querySelector(".state-retry");
          assert(Boolean(retry), viewport + " error state missing Retry");
          validateFocusSafety(viewport + " / error");
          await validateKeyboardFocusHandoff(viewport + " / Retry keyboard", ".state-retry");

          await setUiState("normal");
          validateFocusSafety(viewport + " / normal");
          await validateKeyboardFocusHandoff(viewport + " / Settings keyboard", "#settingsButton");
          await validateCatalog(viewport);
        }

        if (failures.length === 0) {
          result.dataset.status = "pass";
          result.textContent = "LAYOUT_AUDIT_PASS cases=" + cases;
          document.title = "LAYOUT_AUDIT_PASS";
        } else {
          result.dataset.status = "fail";
          result.textContent = "LAYOUT_AUDIT_FAIL cases=" + cases + " | " + failures.join(" | ");
          document.title = "LAYOUT_AUDIT_FAIL";
        }
      }

      const startAudit = () => {
        run().catch((error) => {
          result.dataset.status = "fail";
          result.textContent = "LAYOUT_AUDIT_FAIL | " + (error.stack || error.message || String(error)).replace(/\s+/g, " ");
          document.title = "LAYOUT_AUDIT_FAIL";
        });
      };

      if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
        startAudit();
      } else {
        frame.addEventListener("load", startAudit, { once: true });
      }
    })();
  </script>
</body>
</html>
